<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>踢石头磨圆球 - 碰撞停靠修复版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #14171f;
            color: #f1f5f9;
            font-family: 'Microsoft YaHei', 'Courier New', sans-serif;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f1218;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #hud-top {
            position: absolute;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 20;
            gap: 12px;
        }

        .panel {
            background: rgba(15, 23, 42, 0.86);
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.6;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        .kbd {
            display: inline-block;
            background: #1e293b;
            border: 1px solid #64748b;
            border-radius: 4px;
            padding: 0 6px;
            color: #38bdf8;
            font-weight: bold;
            font-size: 12px;
        }

        .progress-wrap {
            width: 220px;
            height: 14px;
            background: #1e293b;
            border: 1px solid #64748b;
            border-radius: 7px;
            overflow: hidden;
            margin-top: 6px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f97316, #facc15, #22c55e);
            transition: width 0.18s ease-out;
        }

        .action-btn {
            background: #1e293b;
            color: #f8fafc;
            border: 2px solid #38bdf8;
            border-radius: 6px;
            padding: 8px 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.15s;
        }

        .action-btn:hover {
            background: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud-top">
        <div class="panel">
            <div><span class="kbd">W A S D</span> / <span class="kbd">方向键</span> 移动角色 &nbsp;|&nbsp; 走到石头跟前 <span class="kbd">点击鼠标左键</span> 踢石头！</div>
            <div style="margin-top:4px;">
                石头圆润度: <b id="roundness-text" style="color:#facc15;">0%</b>
                &nbsp;|&nbsp; 累计踢击: <b id="kick-count-text" style="color:#38bdf8;">0</b> 次
            </div>
            <div class="progress-wrap">
                <div class="progress-bar" id="roundness-bar"></div>
            </div>
        </div>

        <button class="action-btn" onclick="spawnNewRock()">🪨 换一块新石头 (R)</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let W = window.innerWidth;
let H = window.innerHeight;
function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

// 场地围栏边界
const ARENA = {
    x: 40,
    y: 80,
    w: Math.max(300, W - 80),
    h: Math.max(240, H - 100)
};

function updateArenaBounds() {
    ARENA.w = Math.max(300, W - 80);
    ARENA.h = Math.max(240, H - 100);
}

// ============================================================================
// 1. WebAudio 音效系统
// ============================================================================
let audioCtx = null;
function initAudio() {
    if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playKickRockSound(roundnessRatio) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    const baseFreq = 130 + roundnessRatio * 90;
    osc.frequency.setValueAtTime(baseFreq, now);
    osc.frequency.exponentialRampToValueAtTime(48, now + 0.14);
    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.15);

    if (roundnessRatio < 0.96) {
        const chipOsc = audioCtx.createOscillator();
        const chipGain = audioCtx.createGain();
        chipOsc.type = 'square';
        chipOsc.frequency.setValueAtTime(650 + Math.random() * 450, now);
        chipOsc.frequency.exponentialRampToValueAtTime(180, now + 0.06);
        chipGain.gain.setValueAtTime(0.14, now);
        chipGain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        chipOsc.connect(chipGain);
        chipGain.connect(audioCtx.destination);
        chipOsc.start(now);
        chipOsc.stop(now + 0.07);
    }
}

function playWallThudSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(95, now);
    osc.frequency.exponentialRampToValueAtTime(35, now + 0.1);
    gain.gain.setValueAtTime(0.35, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.11);
}

function playPerfectBallSound() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.08);
        gain.gain.setValueAtTime(0.22, now + idx * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + idx * 0.08);
        osc.stop(now + idx * 0.08 + 0.36);
    });
}

// ============================================================================
// 2. 游戏核心实体（玩家 + 不规则多边形石头）
// ============================================================================
const keys = {};
const mouse = { x: W * 0.5, y: H * 0.5 };

const player = {
    x: W * 0.35,
    y: H * 0.55,
    vx: 0,
    vy: 0,
    radius: 18,
    speed: 260,
    facingAngle: 0,
    walkPhase: 0,
    kickAnimTimer: 0,
    kickLegSide: 1
};

const VERTEX_COUNT = 36;
const rock = {
    x: W * 0.55,
    y: H * 0.55,
    vx: 0,
    vy: 0,
    angle: 0,
    angVel: 0,
    targetRadius: 32,
    radii: [],
    cracks: [],
    roundness: 0,
    isPerfectBall: false,
    kickCount: 0,
    hitFlash: 0
};

let particles = [];
let floatingTexts = [];
let screenShake = 0;

function spawnNewRock() {
    updateArenaBounds();
    rock.x = ARENA.x + ARENA.w * 0.5;
    rock.y = ARENA.y + ARENA.h * 0.5;
    rock.vx = 0;
    rock.vy = 0;
    rock.angle = Math.random() * Math.PI * 2;
    rock.angVel = 0;
    rock.targetRadius = 32;
    rock.isPerfectBall = false;
    rock.kickCount = 0;
    rock.radii = [];

    const lobeCount1 = 3 + Math.floor(Math.random() * 3);
    const lobeCount2 = 5 + Math.floor(Math.random() * 4);
    const phase1 = Math.random() * Math.PI * 2;
    const phase2 = Math.random() * Math.PI * 2;

    for (let i = 0; i < VERTEX_COUNT; i++) {
        const theta = (i / VERTEX_COUNT) * Math.PI * 2;
        const wave1 = Math.sin(theta * lobeCount1 + phase1) * 14;
        const wave2 = Math.cos(theta * lobeCount2 + phase2) * 9;
        const jagged = (Math.random() - 0.3) * 14;
        const r = Math.max(35, 52 + wave1 + wave2 + jagged);
        rock.radii.push(r);
    }

    rock.cracks = [];
    for (let i = 0; i < 8; i++) {
        rock.cracks.push({
            a: Math.random() * Math.PI * 2,
            dist: 0.25 + Math.random() * 0.45,
            len: 6 + Math.random() * 10,
            rot: Math.random() * Math.PI
        });
    }

    computeRoundness();
    updateHUD();
    spawnFloatingText('新石头已就位！走近按左键开踢！', rock.x, rock.y - 68, '#facc15', 20);
}

function computeRoundness() {
    let totalDiff = 0;
    for (let i = 0; i < VERTEX_COUNT; i++) {
        totalDiff += Math.abs(rock.radii[i] - rock.targetRadius);
    }
    const avgDiff = totalDiff / VERTEX_COUNT;
    const raw = 1 - Math.max(0, (avgDiff - 0.65) / 21.0);
    rock.roundness = Math.max(0, Math.min(1, raw));
}

function spawnChipParticles(x, y, dirX, dirY, count, isSpark = false) {
    for (let i = 0; i < count; i++) {
        const spreadAngle = Math.atan2(dirY, dirX) + (Math.random() - 0.5) * 1.8;
        const speed = 70 + Math.random() * 210;
        particles.push({
            x: x + (Math.random() - 0.5) * 16,
            y: y + (Math.random() - 0.5) * 16,
            vx: Math.cos(spreadAngle) * speed,
            vy: Math.sin(spreadAngle) * speed,
            size: isSpark ? (2 + Math.random() * 3) : (3 + Math.random() * 5),
            color: isSpark
                ? (Math.random() < 0.5 ? '#facc15' : '#38bdf8')
                : (Math.random() < 0.5 ? '#94a3b8' : '#64748b'),
            life: 0.45 + Math.random() * 0.4,
            maxLife: 0.85,
            rot: Math.random() * Math.PI * 2
        });
    }
}

function spawnFloatingText(text, x, y, color, size = 20) {
    floatingTexts.push({
        text, x, y, color, size,
        vy: -45,
        life: 1.15
    });
}

function updateHUD() {
    const pct = Math.round(rock.roundness * 100);
    const textEl = document.getElementById('roundness-text');
    const barEl = document.getElementById('roundness-bar');
    const kickEl = document.getElementById('kick-count-text');

    if (textEl) {
        textEl.textContent = rock.isPerfectBall ? '100% (完美石球!)' : `${pct}%`;
        textEl.style.color = rock.isPerfectBall ? '#22c55e' : (pct > 70 ? '#38bdf8' : '#facc15');
    }
    if (barEl) barEl.style.width = `${pct}%`;
    if (kickEl) kickEl.textContent = rock.kickCount;
}

// ============================================================================
// 3. 输入监听与踢石头逻辑（已修复 NaN 导致石头消失的问题）
// ============================================================================
window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR') spawnNewRock();
});

window.addEventListener('keyup', e => {
    keys[e.code] = false;
});

window.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    initAudio();
    tryKickRock();
});

function getAverageRockRadius() {
    if (!rock.radii || rock.radii.length === 0) return rock.targetRadius;
    let sum = 0;
    for (let i = 0; i < VERTEX_COUNT; i++) sum += rock.radii[i];
    return sum / VERTEX_COUNT;
}

function tryKickRock() {
    player.kickAnimTimer = 0.24;
    player.kickLegSide *= -1;

    const dx = rock.x - player.x;
    const dy = rock.y - player.y;
    const dist = Math.hypot(dx, dy);
    const avgR = getAverageRockRadius();
    const reachDist = player.radius + avgR + 38;

    if (dist > reachDist) {
        spawnFloatingText('太远啦！走近一点再踢', player.x, player.y - 34, '#94a3b8', 15);
        return;
    }

    const nx = dist > 0.01 ? dx / dist : Math.cos(player.facingAngle);
    const ny = dist > 0.01 ? dy / dist : Math.sin(player.facingAngle);

    // 施加可靠的有限推力与旋转速度（绝不会产生 NaN）
    const kickPower = 360 + rock.roundness * 220;
    rock.vx = nx * kickPower;
    rock.vy = ny * kickPower;
    rock.angVel = (Math.random() - 0.5) * 8 + (nx >= 0 ? 4 : -4);
    rock.kickCount++;
    rock.hitFlash = 1.0;

    playKickRockSound(rock.roundness);
    screenShake = rock.isPerfectBall ? 5 : 9;

    const impactWorldAngle = Math.atan2(-ny, -nx);
    const impactLocalAngle = impactWorldAngle - rock.angle;

    if (!rock.isPerfectBall) {
        for (let i = 0; i < VERTEX_COUNT; i++) {
            const vAngle = (i / VERTEX_COUNT) * Math.PI * 2;
            const diffAngle = Math.atan2(Math.sin(vAngle - impactLocalAngle), Math.cos(vAngle - impactLocalAngle));
            const contactWeight = Math.max(0.28, Math.pow(Math.cos(diffAngle * 0.5), 2));
            const currentR = rock.radii[i];

            if (currentR > rock.targetRadius) {
                const shave = (currentR - rock.targetRadius) * (0.22 * contactWeight) + 0.65 * contactWeight;
                rock.radii[i] = Math.max(rock.targetRadius, currentR - shave);
            } else if (currentR < rock.targetRadius) {
                rock.radii[i] += (rock.targetRadius - currentR) * 0.25;
            }
        }

        const smoothed = new Array(VERTEX_COUNT);
        for (let i = 0; i < VERTEX_COUNT; i++) {
            const prev = rock.radii[(i - 1 + VERTEX_COUNT) % VERTEX_COUNT];
            const curr = rock.radii[i];
            const next = rock.radii[(i + 1) % VERTEX_COUNT];
            smoothed[i] = prev * 0.2 + curr * 0.6 + next * 0.2;
        }
        rock.radii = smoothed;

        computeRoundness();

        const hitX = rock.x - nx * avgR * 0.85;
        const hitY = rock.y - ny * avgR * 0.85;
        spawnChipParticles(hitX, hitY, -nx, -ny, 14, false);

        if (rock.roundness >= 0.98) {
            rock.isPerfectBall = true;
            rock.roundness = 1.0;
            for (let i = 0; i < VERTEX_COUNT; i++) {
                rock.radii[i] = rock.targetRadius;
            }
            playPerfectBallSound();
            spawnChipParticles(rock.x, rock.y, nx, ny, 32, true);
            spawnFloatingText('🎉 恭喜！你把石头踢成一颗完美圆球了！', rock.x, rock.y - 58, '#22c55e', 24);
        } else {
            const pct = Math.round(rock.roundness * 100);
            spawnFloatingText(`咔嚓！削掉一块棱角 (${pct}%)`, rock.x, rock.y - 46, '#facc15', 17);
        }
    } else {
        const hitX = rock.x - nx * rock.targetRadius;
        const hitY = rock.y - ny * rock.targetRadius;
        spawnChipParticles(hitX, hitY, nx, ny, 8, true);
        spawnFloatingText('⚽ 丝滑石球爆射！', rock.x, rock.y - 46, '#38bdf8', 18);
    }

    updateHUD();
}

// ============================================================================
// 4. 物理更新（石头撞到墙立刻停住不动）
// ============================================================================
function update(dt) {
    updateArenaBounds();
    screenShake *= Math.exp(-dt * 15);
    rock.hitFlash *= Math.exp(-dt * 10);

    if (player.kickAnimTimer > 0) {
        player.kickAnimTimer = Math.max(0, player.kickAnimTimer - dt);
    }

    // 1. 玩家移动
    let moveX = 0;
    let moveY = 0;
    if (keys['KeyW'] || keys['ArrowUp']) moveY -= 1;
    if (keys['KeyS'] || keys['ArrowDown']) moveY += 1;
    if (keys['KeyA'] || keys['ArrowLeft']) moveX -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) moveX += 1;

    if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        moveX /= len;
        moveY /= len;
        player.vx = moveX * player.speed;
        player.vy = moveY * player.speed;
        player.x += player.vx * dt;
        player.y += player.vy * dt;
        player.walkPhase += dt * 12;
    } else {
        player.vx = 0;
        player.vy = 0;
    }

    // 限制玩家在围栏内
    player.x = Math.max(ARENA.x + player.radius, Math.min(ARENA.x + ARENA.w - player.radius, player.x));
    player.y = Math.max(ARENA.y + player.radius, Math.min(ARENA.y + ARENA.h - player.radius, player.y));

    const distToRock = Math.hypot(rock.x - player.x, rock.y - player.y);
    if (distToRock < 120) {
        player.facingAngle = Math.atan2(rock.y - player.y, rock.x - player.x);
    } else {
        player.facingAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
    }

    // 2. 玩家与石头的物理防穿模推挤
    const avgR = getAverageRockRadius();
    const minDist = player.radius + avgR;
    const dx = rock.x - player.x;
    const dy = rock.y - player.y;
    const dist = Math.hypot(dx, dy);
    if (dist > 0.001 && dist < minDist) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;
        player.x -= nx * overlap;
        player.y -= ny * overlap;
    }

    // 3. 安全保护：防止任何异常数值
    if (!Number.isFinite(rock.x) || !Number.isFinite(rock.y)) {
        rock.x = ARENA.x + ARENA.w * 0.5;
        rock.y = ARENA.y + ARENA.h * 0.5;
        rock.vx = 0;
        rock.vy = 0;
    }
    if (!Number.isFinite(rock.angle)) rock.angle = 0;

    // 4. 石头移动与滚动阻尼
    rock.x += rock.vx * dt;
    rock.y += rock.vy * dt;
    rock.angle += rock.angVel * dt;

    const speed = Math.hypot(rock.vx, rock.vy);
    if (speed > 2) {
        const roughness = 1 - rock.roundness;
        const bump = roughness * Math.abs(Math.sin(rock.angle * 3)) * 1.8;
        const damping = Math.pow(0.06 + rock.roundness * 0.28, dt) * Math.exp(-bump * dt);
        rock.vx *= damping;
        rock.vy *= damping;
        rock.angVel = (speed / Math.max(20, avgR)) * (rock.vx >= 0 ? 1 : -1) * (0.4 + rock.roundness * 0.6);
    } else {
        rock.vx = 0;
        rock.vy = 0;
        rock.angVel = 0;
    }

    // 5. 【核心修改】石头撞到围栏墙壁就直接停住不动！
    const minX = ARENA.x + avgR;
    const maxX = ARENA.x + ARENA.w - avgR;
    const minY = ARENA.y + avgR;
    const maxY = ARENA.y + ARENA.h - avgR;

    let hitWall = false;
    if (rock.x < minX) {
        rock.x = minX;
        hitWall = true;
    } else if (rock.x > maxX) {
        rock.x = maxX;
        hitWall = true;
    }
    if (rock.y < minY) {
        rock.y = minY;
        hitWall = true;
    } else if (rock.y > maxY) {
        rock.y = maxY;
        hitWall = true;
    }

    if (hitWall) {
        if (Math.hypot(rock.vx, rock.vy) > 30) {
            playWallThudSound();
            spawnChipParticles(rock.x, rock.y, -rock.vx, -rock.vy, 6, false);
        }
        // 撞墙后速度与旋转立刻归零，稳稳停在墙边！
        rock.vx = 0;
        rock.vy = 0;
        rock.angVel = 0;
    }

    // 6. 更新粒子与浮动文字
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= Math.exp(-dt * 5);
        p.vy *= Math.exp(-dt * 5);
        p.rot += dt * 8;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y += ft.vy * dt;
        ft.vy *= Math.exp(-dt * 3);
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
}

// ============================================================================
// 5. 渲染逻辑
// ============================================================================
function render() {
    ctx.save();
    if (screenShake > 0.2) {
        ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }

    ctx.fillStyle = '#14171f';
    ctx.fillRect(0, 0, W, H);

    // 场地石板砖地面
    ctx.fillStyle = '#1e232d';
    ctx.fillRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    ctx.strokeStyle = '#171b24';
    ctx.lineWidth = 2;
    const tileSize = 64;
    for (let x = ARENA.x; x < ARENA.x + ARENA.w; x += tileSize) {
        ctx.beginPath();
        ctx.moveTo(x, ARENA.y);
        ctx.lineTo(x, ARENA.y + ARENA.h);
        ctx.stroke();
    }
    for (let y = ARENA.y; y < ARENA.y + ARENA.h; y += tileSize) {
        ctx.beginPath();
        ctx.moveTo(ARENA.x, y);
        ctx.lineTo(ARENA.x + ARENA.w, y);
        ctx.stroke();
    }

    // 厚实围栏边框（撞上即停）
    ctx.strokeStyle = '#475569';
    ctx.lineWidth = 6;
    ctx.strokeRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h);

    // 可踢击范围圈
    const avgR = getAverageRockRadius();
    const reachDist = player.radius + avgR + 38;
    const dist = Math.hypot(rock.x - player.x, rock.y - player.y);
    const canKick = dist <= reachDist;

    ctx.save();
    ctx.beginPath();
    ctx.arc(rock.x, rock.y, reachDist, 0, Math.PI * 2);
    ctx.strokeStyle = canKick ? 'rgba(56, 189, 248, 0.55)' : 'rgba(148, 163, 184, 0.16)';
    ctx.setLineDash([6, 6]);
    ctx.lineWidth = canKick ? 2.5 : 1.5;
    ctx.stroke();
    ctx.restore();

    drawRock();

    for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
    }

    drawPlayer();

    for (const ft of floatingTexts) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, ft.life / 0.3);
        ctx.font = `bold ${ft.size}px "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 4;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
    }

    ctx.restore();
}

function drawRock() {
    ctx.save();
    ctx.translate(rock.x, rock.y);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.42)';
    ctx.beginPath();
    ctx.arc(6, 8, getAverageRockRadius() * 0.96, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(rock.angle);

    if (rock.isPerfectBall) {
        const r = rock.targetRadius;
        const grad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.15, 0, 0, r);
        grad.addColorStop(0, '#f8fafc');
        grad.addColorStop(0.45, '#94a3b8');
        grad.addColorStop(1, '#334155');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = 'rgba(15, 23, 42, 0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(0, 0, r * 0.92, r * 0.35, 0.4, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
    } else {
        ctx.beginPath();
        for (let i = 0; i < VERTEX_COUNT; i++) {
            const theta = (i / VERTEX_COUNT) * Math.PI * 2;
            const r = rock.radii[i];
            const vx = Math.cos(theta) * r;
            const vy = Math.sin(theta) * r;
            if (i === 0) ctx.moveTo(vx, vy);
            else ctx.lineTo(vx, vy);
        }
        ctx.closePath();

        const rCol = Math.round(105 + rock.roundness * 65);
        const gCol = Math.round(112 + rock.roundness * 68);
        const bCol = Math.round(125 + rock.roundness * 72);
        ctx.fillStyle = rock.hitFlash > 0.1
            ? `rgb(${Math.min(255, rCol + 60)}, ${Math.min(255, gCol + 55)}, ${Math.min(255, bCol + 40)})`
            : `rgb(${rCol}, ${gCol}, ${bCol})`;
        ctx.fill();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.6;
        ctx.stroke();

        ctx.save();
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.22)';
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(0, 0, rock.targetRadius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        const crackAlpha = Math.max(0, 0.45 * (1 - rock.roundness * 1.1));
        if (crackAlpha > 0.02) {
            ctx.strokeStyle = `rgba(15, 23, 42, ${crackAlpha})`;
            ctx.lineWidth = 1.6;
            for (const c of rock.cracks) {
                const cx = Math.cos(c.a) * (rock.targetRadius * c.dist);
                const cy = Math.sin(c.a) * (rock.targetRadius * c.dist);
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(c.rot) * c.len, cy + Math.sin(c.rot) * c.len);
                ctx.stroke();
            }
        }
    }

    ctx.restore();
}

function drawPlayer() {
    ctx.save();
    ctx.translate(player.x, player.y);

    ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
    ctx.beginPath();
    ctx.arc(4, 6, player.radius, 0, Math.PI * 2);
    ctx.fill();

    ctx.rotate(player.facingAngle);

    const kickProgress = player.kickAnimTimer > 0
        ? Math.sin((player.kickAnimTimer / 0.24) * Math.PI)
        : 0;
    const walkSwing = Math.sin(player.walkPhase) * 6;

    const leftFootX = (player.kickLegSide === -1 ? kickProgress * 24 : -walkSwing);
    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.ellipse(leftFootX + 6, -9, 9, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    const rightFootX = (player.kickLegSide === 1 ? kickProgress * 24 : walkSwing);
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.ellipse(rightFootX + 6, 9, 9, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#38bdf8';
    ctx.strokeStyle = '#0f172a';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#1e293b';
    ctx.beginPath();
    ctx.arc(-2, 0, 11, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#f8fafc';
    ctx.beginPath();
    ctx.arc(10, 0, 3.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// ============================================================================
// 6. 初始化与主循环
// ============================================================================
spawnNewRock();

let lastTime = performance.now();
function loop(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
    lastTime = now;

    update(dt);
    render();

    requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
